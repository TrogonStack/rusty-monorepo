# Reference Clippy policy for every Rust repository. Copy the tables below
# into the root `Cargo.toml`, and `clippy.toml` beside this file to the
# repository root, keeping both in sync with these files; a repo may be
# stricter than this policy, never looser.
#
# Workspace lints only reach a crate whose own `Cargo.toml` opts in with:
#
#   [lints]
#   workspace = true

[workspace.lints.clippy]
# Enforces the methods listed in `clippy.toml`. It is used for
# `process::exit` instead of the `exit` lint because `exit` does not look
# inside `main`, where a call skips destructors just the same.
disallowed_methods = "deny"
