allow-unwrap-in-tests = true
disallowed-methods = [
    { path = "std::process::exit", reason = "skips every pending destructor; return `std::process::ExitCode` from `main` instead" },
    { path = "std::panic::catch_unwind", reason = "only works under panic=unwind and invites relying on panics for control flow; fix the panic or return a `Result`" },
    { path = "std::sync::PoisonError::into_inner", reason = "a poisoned lock holds state a panicking thread left half-written; propagate the poison instead of reading past it" },
    { path = "std::sync::PoisonError::get_ref", reason = "a poisoned lock holds state a panicking thread left half-written; propagate the poison instead of reading past it" },
    { path = "std::sync::PoisonError::get_mut", reason = "a poisoned lock holds state a panicking thread left half-written; propagate the poison instead of reading past it" },
]
