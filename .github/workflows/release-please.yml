name: cd / release please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release please
        id: release
        uses: TrogonStack/github-actions/actions/release-please@1ac8b52a4b60bb9efa39fc22461e3852d14282da
        with:
          token: ${{ secrets.GH_PAT_RELEASE_PLEASE_ACTION }}
