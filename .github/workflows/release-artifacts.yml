name: cd / release artifacts

on:
  push:
    tags:
      - "trg@v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing trg tag to (re)publish artifacts for (e.g. trg@v0.4.0)"
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # Manual republishing can attest an arbitrary tag, so it waits for an approval.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'release-manual' || null }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            use-cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            use-cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Extract version from tag
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^trg@v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "not a trg release tag: $TAG" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#trg@v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@f7126fc51b8848024ac3cd7854dfc4ab4268986a # cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }} --package trg
          else
            cargo build --locked --release --target ${{ matrix.target }} --package trg
          fi

      - name: Package
        shell: bash
        run: |
          staging="trg-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/trg" "$staging/"
          cp LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  upload:
    name: Upload to release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'release-manual' || null }}
    permissions:
      contents: write
      attestations: write
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      hashes: ${{ steps.meta.outputs.hashes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum trg-* > sha256sums.txt

      - name: Attest checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/sha256sums.txt

      - name: Collect SLSA subjects
        id: meta
        working-directory: artifacts
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "hashes=$(sha256sum trg-*.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

      # No --clobber: assets of a published release must never be silently replaced.
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" artifacts/*

  slsa-provenance:
    name: SLSA provenance
    needs: upload
    permissions:
      actions: read
      contents: write
      id-token: write
    # Reusable workflows from slsa-github-generator must be referenced by tag, not SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.upload.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.upload.outputs.tag }}

  packslip:
    name: Packslip manifest
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Resolve tag, version and commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.upload.outputs.tag }}
        run: |
          {
            echo "tag=$TAG"
            echo "version=${TAG#trg@v}"
            echo "commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/${TAG//@/%40}" --jq .sha)"
          } >> "$GITHUB_OUTPUT"

      - name: Sign packslip manifest
        uses: jdx/packslip@44e50e5f64551234b4a382d991bd7f7f7d021d06 # v1
        with:
          project: github.com/${{ github.repository }}/trg
          tag: ${{ steps.release.outputs.tag }}
          version: ${{ steps.release.outputs.version }}
          commit: ${{ steps.release.outputs.commit }}
          download: trg-*.tar.gz
          bin: trg
