name: cd / release artifacts

on:
  push:
    tags:
      - "trg@v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing trg tag to (re)publish artifacts for (e.g. trg@v0.4.0)"
        required: true
        type: string

permissions: {}

env:
  # The release tasks are plain bash; they must not pull the workspace toolchain.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: workflow-tooling
    # Manual republishing can attest an arbitrary tag, so it waits for an approval.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'release-manual' || null }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            use-cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            use-cross: false

    steps:
      # The release tasks come from the ref the workflow runs from, so republishing an
      # old tag that predates them still works; only the sources come from the tag.
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-tooling
          persist-credentials: false

      - name: Checkout release sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: release-source
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.1
          install: false
          cache: false
          working_directory: workflow-tooling

      - name: Extract version from tag
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: mise run github:workflows:release-artifacts:extract-version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@f7126fc51b8848024ac3cd7854dfc4ab4268986a # cross

      - name: Build
        env:
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
          RELEASE_TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.use-cross }}
        run: mise run github:workflows:release-artifacts:build

      - name: Package
        env:
          RELEASE_SOURCE_ROOT: ${{ github.workspace }}/release-source
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: mise run github:workflows:release-artifacts:package

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  upload:
    name: Upload to release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'release-manual' || null }}
    permissions:
      contents: write
      attestations: write
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.1
          install: false
          cache: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: mise run github:workflows:release-artifacts:generate-checksums

      - name: Attest checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/sha256sums.txt

      - name: Record release tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: mise run github:workflows:release-artifacts:record-tag

      # No --clobber: assets of a published release must never be silently replaced.
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: mise run github:workflows:release-artifacts:upload

  packslip:
    name: Packslip manifest
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.9.1
          install: false
          cache: false

      - name: Resolve tag, version and commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.upload.outputs.tag }}
        run: mise run github:workflows:release-artifacts:resolve-metadata

      - name: Sign packslip manifest
        uses: jdx/packslip@44e50e5f64551234b4a382d991bd7f7f7d021d06 # v1
        with:
          project: github.com/${{ github.repository }}/trg
          tag: ${{ steps.release.outputs.tag }}
          version: ${{ steps.release.outputs.version }}
          commit: ${{ steps.release.outputs.commit }}
          download: trg-*.tar.gz
          bin: trg
