name: cd / release artifacts

on:
  push:
    tags:
      - "trg@v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing trg tag to (re)publish artifacts for (e.g. trg@v0.4.0)"
        required: true
        type: string

permissions: {}

env:
  # The release tasks are plain bash; they must not pull the workspace toolchain.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # Manual republishing can attest an arbitrary tag, so it waits for an approval.
    environment: ${{ github.event_name == 'workflow_dispatch' && 'release-manual' || null }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            use-cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            use-cross: false

    steps:
      # The release tasks come from the ref the workflow runs from, so republishing an
      # old tag that predates them still works; only the sources come from the tag.
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout release sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: source

      - name: Install mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.1
          install: false

      - name: Extract version from tag
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          {
            echo "tag=$TAG"
            echo "version=$(mise run -q release:version "$TAG")"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        uses: taiki-e/install-action@f7126fc51b8848024ac3cd7854dfc4ab4268986a # cross

      - name: Build
        shell: bash
        working-directory: source
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --locked --release --target ${{ matrix.target }} --package trg
          else
            cargo build --locked --release --target ${{ matrix.target }} --package trg
          fi

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: echo "ASSET=$(mise run -q release:package "$VERSION" "$TARGET" source)" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  upload:
    name: Upload to release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'release-manual' || null }}
    permissions:
      contents: write
      attestations: write
      id-token: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      hashes: ${{ steps.meta.outputs.hashes }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.1
          install: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: mise run -q release:checksums artifacts

      - name: Attest checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/sha256sums.txt

      - name: Collect SLSA subjects
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          {
            echo "tag=$TAG"
            echo "hashes=$(mise run -q release:subjects artifacts)"
          } >> "$GITHUB_OUTPUT"

      # No --clobber: assets of a published release must never be silently replaced.
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" artifacts/*

  slsa-provenance:
    name: SLSA provenance
    needs: upload
    permissions:
      actions: read
      contents: write
      id-token: write
    # Reusable workflows from slsa-github-generator must be referenced by tag, not SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.upload.outputs.hashes }}
      upload-assets: true
      upload-tag-name: ${{ needs.upload.outputs.tag }}

  packslip:
    name: Packslip manifest
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.9.1
          install: false

      - name: Resolve tag, version and commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.upload.outputs.tag }}
        run: |
          {
            echo "tag=$TAG"
            echo "version=$(mise run -q release:version "$TAG")"
            echo "commit=$(mise run -q release:commit "$TAG")"
          } >> "$GITHUB_OUTPUT"

      - name: Sign packslip manifest
        uses: jdx/packslip@44e50e5f64551234b4a382d991bd7f7f7d021d06 # v1
        with:
          project: github.com/${{ github.repository }}/trg
          tag: ${{ steps.release.outputs.tag }}
          version: ${{ steps.release.outputs.version }}
          commit: ${{ steps.release.outputs.commit }}
          download: trg-*.tar.gz
          bin: trg
