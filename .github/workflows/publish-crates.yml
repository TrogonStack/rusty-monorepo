name: cd / publish crates

on:
  push:
    tags:
      - "trogon_dylint_lints@v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing trogon_dylint_lints tag to publish (e.g. trogon_dylint_lints@v0.0.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  trogon-dylint-lints:
    name: Publish trogon_dylint_lints
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing: crates.io trades this workflow's OIDC identity for a
      # short-lived token, so no registry credential lives in repository secrets.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
          install_args: rust cargo:dylint-link

      - name: Install the pinned lint toolchain
        run: mise run lints:toolchain

      - name: Verify the tag matches the manifest
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tagged="${TAG#trogon_dylint_lints@v}"
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/trogon_dylint_lints/Cargo.toml | head -1)"
          if [ "$tagged" != "$manifest" ]; then
            echo "tag $TAG does not match Cargo.toml version $manifest" >&2
            exit 1
          fi

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        working-directory: crates/trogon_dylint_lints
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup run "$channel" cargo publish --locked
