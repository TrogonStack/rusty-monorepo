name: Skill Evals Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate skill eval suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v5
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build trg
        run: cargo build -p trg

      - name: Run skill-evals validation against every skill
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t suites < <(find . \
            -type d \( -name target -o -name node_modules -o -name .git \) -prune -o \
            -type f -name evals.json -path '*/evals/evals.json' -print | sort)

          if [ "${#suites[@]}" -eq 0 ]; then
            echo "No skill eval suites found — nothing to validate."
            exit 0
          fi

          out_root="$(mktemp -d)"
          status=0
          for suite in "${suites[@]}"; do
            skill_dir="$(dirname "$(dirname "$suite")")"
            echo "::group::Validating $skill_dir"
            if ! ./target/debug/trg ai skills eval run "$skill_dir" --out "$out_root"; then
              status=1
            fi
            echo "::endgroup::"
          done

          exit "$status"
