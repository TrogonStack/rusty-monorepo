[package]
name = "trogon_object_id_derive"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Derive macros for typed object ID domains and unions"
repository = "https://github.com/TrogonStack/rusty-monorepo"
readme = "README.md"

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0"
proc-macro-crate = "3.5"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
