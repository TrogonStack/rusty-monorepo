[package]
name = "trogon_object_id"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Type-safe prefixed identifiers with compile-time checked declarations"
repository = "https://github.com/TrogonStack/rusty-monorepo"
readme = "README.md"

[lints]
workspace = true

[dependencies]
thiserror = { version = "2.0", default-features = false }
serde = { version = "1.0", default-features = false, optional = true }
uuid = { version = "1.26", default-features = false, optional = true }
trogon_object_id_derive = { version = "0.1.0", path = "../trogon_object_id_derive", optional = true }
trogon_uuid = { version = "0.1.0", path = "../trogon_uuid", default-features = false, optional = true }

[features]
default = []
alloc = ["serde?/alloc"]
macros = ["dep:trogon_object_id_derive"]
serde = ["dep:serde"]
uuid = ["dep:uuid"]
template = ["uuid", "dep:trogon_uuid"]
uuid-generate = ["uuid", "uuid/std", "uuid/v4", "uuid/v7"]

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
stats_alloc = "0.1.10"
