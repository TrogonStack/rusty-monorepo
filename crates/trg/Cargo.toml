[package]
name = "trg"
version = "0.11.0"
edition = "2021"
publish = false
readme = "README.md"

[features]
default = ["schema-validation"]
schema-validation = ["dep:jsonschema"]

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
gray_matter = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
secrecy = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "json"] }
rmcp = { version = "3.1.4", features = [
    "auth",
    "client",
    "transport-async-rw",
    "transport-io",
    "transport-worker",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
async-trait = "0.1"
oauth2 = { version = "5.0", default-features = false }
tiny_http = "0.12"
open = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = { workspace = true }
jsonschema = { version = "0.49", optional = true }
schemars = { workspace = true }
libc = { workspace = true }
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
    "metrics",
    "logs",
    "internal-logs",
] }
opentelemetry-appender-tracing = "0.33"
opentelemetry-semantic-conventions = { version = "0.33", features = ["semconv_experimental"] }
tracing-opentelemetry = "0.34"

[[bin]]
name = "generate-schemas"
path = "src/bin/generate_schemas.rs"

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = { workspace = true }
jsonschema = "0.49"
opentelemetry_sdk = { version = "0.33", features = ["testing", "trace", "metrics", "logs"] }
