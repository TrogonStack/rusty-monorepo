[package]
name = "trogon_claims"
version = "0.0.0"
edition = "2021"
rust-version = "1.94"
publish = false
description = "Validated claim, identity, and principal value objects"
license = "Apache-2.0"

[features]
default = []
macros = ["dep:trogon_claims_macros"]
json = ["dep:serde_json", "dep:fluent-uri"]
spicedb = ["dep:prost", "dep:prost-types"]

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(feature, values("axum", "serde"))'] }
warnings = "deny"

[lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[dependencies]
trogon_claims_syntax = { path = "../trogon_claims_syntax" }
trogon_claims_macros = { path = "../trogon_claims_macros", optional = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"], optional = true }
fluent-uri = { version = "0.4.1", default-features = false, optional = true }
prost = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }

[dev-dependencies]
trybuild = { workspace = true }

chrono = { version = "0.4", default-features = false, features = ["std"] }

[[bench]]
name = "ingest"
harness = false
required-features = ["json"]
