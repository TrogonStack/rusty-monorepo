[package]
name = "trogon_claims"
version = "0.0.0"
edition = "2021"
rust-version = "1.94"
publish = false
description = "Validated claim, identity, and principal value objects"
license = "Apache-2.0"

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(feature, values("json", "axum", "macros", "serde"))'] }
warnings = "deny"

[lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[dependencies]
trogon_claims_syntax = { path = "../trogon_claims_syntax" }
thiserror = { workspace = true }

[dev-dependencies]

chrono = { version = "0.4", default-features = false, features = ["std"] }

