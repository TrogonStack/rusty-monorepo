[package]
name = "trogon_uuid"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Static UUIDv5 identity recipes with borrowed typed inputs"
repository = "https://github.com/TrogonStack/rusty-monorepo"
readme = "README.md"

[lints]
workspace = true

[dependencies]
uuid = { version = "1.26", features = ["v5"] }
sha1_smol = "1.0"

[dev-dependencies]
stats_alloc = "0.1.10"
