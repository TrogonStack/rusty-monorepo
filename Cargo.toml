[workspace]
members = ["crates/trg", "crates/trogon_presence", "crates/trogon_presence_auth", "crates/trogon_presence_e2e", "crates/trogon_presence_hooks", "crates/trogon_presence_load", "crates/trogon_presence_service"]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gray_matter = "0.3"
thiserror = "2.0"
unicode-normalization = "0.1"
tempfile = "3.27"
assert_cmd = "2.2"
toml = "1.1"
secrecy = { version = "0.10", features = ["serde"] }
tokio = { version = "1.42", features = ["io-std", "macros", "process", "rt-multi-thread"] }
http = "1.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
regex = "1.11"
schemars = "1.2"
libc = "0.2"
base64 = "0.22"
getrandom = "0.3"
proptest = "1.7"
criterion = "0.7"
async-nats = { version = "=0.50.0", features = ["server_2_12"] }
bytes = "1"
sha2 = "0.10"
tracing = "0.1"
futures-util = "0.3"
