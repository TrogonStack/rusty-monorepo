[workspace]
members = [
  "crates/trg",
  "crates/trogon_claims",
  "crates/trogon_claims_macros",
  "crates/trogon_claims_syntax",
]
resolver = "2"

[workspace.lints.clippy]
derivable_impls = "deny"
disallowed_methods = "deny"
len_without_is_empty = "deny"
missing_assert_message = "deny"
new_without_default = "deny"
should_implement_trait = "deny"
string_add = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_unwrap = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gray_matter = "0.3"
thiserror = "2.0"
unicode-normalization = "0.1"
tempfile = "3.27"
assert_cmd = "2.2"
toml = "1.1"
secrecy = { version = "0.10", features = ["serde"] }
tokio = { version = "1.42", features = ["io-std", "macros", "process", "rt-multi-thread"] }
http = "1.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
regex = "1.11"
schemars = "1.2"
libc = "0.2"
zeroize = "1.8"
prost = "0.14"
prost-types = "0.14"
axum = { version = "0.8", default-features = false }
axum-core = "0.5"
tower = { version = "0.5", default-features = false, features = ["util"] }
trybuild = "1.0"
