[settings]
task.run_auto_install = false

[tools]
rust = { version = "stable", components = ["rustfmt", "clippy"] }
"cargo:cargo-audit" = { version = "0.22.2", locked = true }
"cargo:cargo-tarpaulin" = { version = "0.37.2", locked = true }
"cargo:cargo-dylint" = { version = "6.0.1", locked = true }
"cargo:dylint-link" = { version = "6.0.1", locked = true }

[tasks]
check = { depends = ["check:format", "check:clippy", "check:test", "claims:check"] }
